<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="42" viewBox="0 0 1000 42" role="img" aria-label="">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#181828" stop-opacity="0"/>
      <stop offset=".3" stop-color="#484868"/>
      <stop offset=".5" stop-color="#986868"/>
      <stop offset=".7" stop-color="#787898"/>
      <stop offset="1" stop-color="#181828" stop-opacity="0"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1000" height="42" fill="black"/>
      <circle cx="500" cy="21" r="11" fill="white"/>
      <circle cx="505" cy="17" r="10" fill="black"/>
    </mask>
  </defs>

  <style>
    .signal { stroke-dasharray: 24 10; animation: drift 10s linear infinite; }
    .ghost { animation: offset 6s steps(1, end) infinite; }
    .star-a { animation: blink 2.8s steps(1, end) infinite; }
    .star-b { animation: blink 2.8s 1.4s steps(1, end) infinite; }
    @keyframes drift { to { stroke-dashoffset: -136; } }
    @keyframes offset {
      0%, 94%, 100% { transform: translate(0, 0); }
      95% { transform: translate(2px, 0); }
      96% { transform: translate(-1px, 0); }
    }
    @keyframes blink {
      0%, 40%, 100% { opacity: .25; }
      41%, 65% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .ghost, .star-a, .star-b { animation: none; }
    }
  </style>

  <path class="signal" d="M38 21H462M538 21H962" fill="none" stroke="url(#line)" stroke-width="1"/>
  <circle class="ghost" cx="502" cy="21" r="11" fill="#681818" opacity=".36" mask="url(#crescent)"/>
  <circle cx="500" cy="20" r="11" fill="#9C9CB4" mask="url(#crescent)"/>
  <circle class="star-a" cx="475" cy="20" r="1.8" fill="#A87868"/>
  <circle class="star-b" cx="527" cy="17" r="1.5" fill="#8888A8"/>
</svg>
