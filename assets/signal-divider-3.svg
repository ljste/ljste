<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="34" viewBox="0 0 1000 34" role="img" aria-label="" style="--phase:-1.6s">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A87868" stop-opacity="0"/>
      <stop offset=".42" stop-color="#A87868" stop-opacity=".75"/>
      <stop offset=".72" stop-color="#C4BFD1"/>
      <stop offset="1" stop-color="#C4BFD1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track"><rect x="58" y="5" width="884" height="24"/></clipPath>
  </defs>
  <style>
    .rail-a,.rail-b,.sweep,.cursor,.tick-a,.tick-b,.tick-c,.frame {
      animation-duration:5.6s;
      animation-iteration-count:infinite;
      animation-delay:var(--phase);
    }
    .rail-a { stroke-dasharray:2 9; animation-name:rail-a; animation-timing-function:linear; }
    .rail-b { stroke-dasharray:2 9; animation-name:rail-b; animation-timing-function:linear; }
    .sweep { animation-name:sweep; animation-timing-function:cubic-bezier(.55,0,.25,1); }
    .cursor { animation-name:cursor; animation-timing-function:steps(1,end); }
    .tick-a { animation-name:pulse-a; animation-timing-function:steps(1,end); }
    .tick-b { animation-name:pulse-b; animation-timing-function:steps(1,end); }
    .tick-c { animation-name:pulse-c; animation-timing-function:steps(1,end); }
    .frame { transform-origin:50% 50%; animation-name:jitter; animation-timing-function:steps(1,end); }
    @keyframes rail-a { to { stroke-dashoffset:-110; } }
    @keyframes rail-b { to { stroke-dashoffset:110; } }
    @keyframes sweep {
      0%,5% { transform:translateX(-220px); opacity:0; }
      10% { opacity:1; }
      72% { transform:translateX(1120px); opacity:1; }
      78%,100% { transform:translateX(1120px); opacity:0; }
    }
    @keyframes cursor {
      0%,16%,32%,48%,64%,80%,96% { opacity:1; }
      8%,24%,40%,56%,72%,88%,100% { opacity:.18; }
    }
    @keyframes pulse-a { 0%,18%,58%,100% { opacity:.22; } 19%,42%,72%,88% { opacity:.9; } }
    @keyframes pulse-b { 0%,28%,68%,100% { opacity:.22; } 29%,52%,82%,94% { opacity:.95; } }
    @keyframes pulse-c { 0%,8%,48%,88%,100% { opacity:.22; } 9%,32%,62%,78% { opacity:.9; } }
    @keyframes jitter {
      0%,92%,100% { transform:translate(0,0); }
      93% { transform:translate(1.5px,0); }
      95% { transform:translate(-1px,.5px); }
    }
  </style>
  <g class="frame">
    <path d="M58 17H942" stroke="#484868" stroke-width="1" opacity=".5"/>
    <path class="rail-a" d="M58 12H942" stroke="#787898" stroke-width=".6" opacity=".32"/>
    <path class="rail-b" d="M58 22H942" stroke="#787898" stroke-width=".6" opacity=".32"/>
    <g clip-path="url(#track)">
      <g class="sweep">
        <rect x="0" y="14" width="190" height="6" fill="url(#beam)"/>
        <rect class="cursor" x="174" y="10" width="4" height="14" fill="#D8D4E0"/>
        <rect x="177" y="10" width="2" height="14" fill="#681818" opacity=".65"/>
      </g>
    </g>
    <g transform="translate(500 17)">
      <rect class="tick-a" x="-17" y="-3" width="5" height="6" fill="#A87868"/>
      <rect class="tick-b" x="-3" y="-3" width="6" height="6" fill="#C4BFD1"/>
      <rect class="tick-c" x="12" y="-3" width="5" height="6" fill="#8888A8"/>
    </g>
  </g>
</svg>

