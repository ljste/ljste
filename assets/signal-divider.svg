<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="34" viewBox="0 0 1000 34" role="img" aria-label="">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A87868" stop-opacity="0"/>
      <stop offset=".42" stop-color="#A87868" stop-opacity=".75"/>
      <stop offset=".72" stop-color="#C4BFD1"/>
      <stop offset="1" stop-color="#C4BFD1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track">
      <rect x="58" y="5" width="884" height="24"/>
    </clipPath>
  </defs>

  <style>
    .signal {
      stroke-dasharray: 2 9;
      animation: tracking 11s linear infinite;
    }
    .sweep {
      animation: sweep 5.4s cubic-bezier(.55, 0, .25, 1) infinite;
    }
    .cursor {
      animation: cursor 900ms steps(1, end) infinite;
    }
    .frame {
      transform-origin: 50% 50%;
      animation: jitter 7s steps(1, end) infinite;
    }
    .tick-a { animation: pulse 2.4s steps(1, end) infinite; }
    .tick-b { animation: pulse 2.4s .4s steps(1, end) infinite; }
    .tick-c { animation: pulse 2.4s .8s steps(1, end) infinite; }
    @keyframes tracking { to { stroke-dashoffset: -132; } }
    @keyframes sweep {
      0%, 8% { transform: translateX(-220px); opacity: 0; }
      14% { opacity: 1; }
      68% { transform: translateX(1120px); opacity: 1; }
      74%, 100% { transform: translateX(1120px); opacity: 0; }
    }
    @keyframes cursor { 0%, 48% { opacity: 1; } 49%, 100% { opacity: .18; } }
    @keyframes jitter {
      0%, 94%, 100% { transform: translate(0, 0); }
      95% { transform: translate(1.5px, 0); }
      96% { transform: translate(-1px, .5px); }
    }
    @keyframes pulse { 0%, 35%, 100% { opacity: .22; } 36%, 62% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) {
      .signal, .sweep, .cursor, .frame, .tick-a, .tick-b, .tick-c { animation: none; }
      .sweep { transform: translateX(430px); opacity: .7; }
    }
  </style>

  <g class="frame">
    <path d="M58 17H942" stroke="#484868" stroke-width="1" opacity=".5"/>
    <path class="signal" d="M58 12H942M58 22H942" stroke="#787898" stroke-width=".6" opacity=".32"/>

    <g clip-path="url(#track)">
      <g class="sweep">
        <rect x="0" y="14" width="190" height="6" fill="url(#beam)"/>
        <rect class="cursor" x="174" y="10" width="4" height="14" fill="#D8D4E0"/>
        <rect x="177" y="10" width="2" height="14" fill="#681818" opacity=".65"/>
      </g>
    </g>

    <g transform="translate(500 17)">
      <rect class="tick-a" x="-17" y="-3" width="5" height="6" fill="#A87868"/>
      <rect class="tick-b" x="-3" y="-3" width="6" height="6" fill="#C4BFD1"/>
      <rect class="tick-c" x="12" y="-3" width="5" height="6" fill="#8888A8"/>
    </g>
  </g>
</svg>
